name: Build & Deploy Bunyan Core System

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GCP_PROJECT_ID: gifted-force-fxctm
  CLOUD_RUN_REGION: us-central1
  CLOUD_RUN_SERVICE: bunyan-core-system
  FIRESTORE_DB_ID: ai-studio-a758e3b4-81b5-47a3-a9ca-2d6487629b67

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type-check, test & build production bundle
        run: |
          npm run lint
          npm test
          npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy Firestore security rules
        run: |
          npx --yes firebase-tools@latest deploy \
            --only firestore:rules \
            --project ${{ env.GCP_PROJECT_ID }} \
            --non-interactive

      - name: Deploy to Google Cloud Run (us-central1)
        run: |
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --source . \
            --project ${{ env.GCP_PROJECT_ID }} \
            --region ${{ env.CLOUD_RUN_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "NODE_ENV=production,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
